[project]
name = "edgebot"
version = "0.1.0"
description = "Shared bus and message definitions for Edge AI Robotics"
requires-python = ">=3.10"
dependencies = ["pyzmq>=25", "msgpack>=1.0"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["edgebot*"]
