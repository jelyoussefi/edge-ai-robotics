name: edge-ai-robotics

x-bus-env: &bus-env
  BUS_PUB: tcp://bus:5555
  BUS_SUB: tcp://bus:5556
  PYTHONUNBUFFERED: "1"

services:

  # Message broker. Every other service connects here, so adding perception
  bus:
    build:
      context: .
      dockerfile: services/bus/Dockerfile
    environment: *bus-env
    expose:
      - "5555"
      - "5556"
    restart: unless-stopped

  # Physics. CPU only — MuJoCo's solver does not use the GPU, which is what
  # leaves the iGPU free for rendering and, later, perception.
  sim:
    build:
      context: .
      dockerfile: services/sim/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      POLICY: rl
      # "lateral" paces across the view at a constant distance, so the robot
      # keeps the same apparent size; "axial" walks along the optical axis.
      # The robot paces the optical axis between these two limits, turning on
      # the spot at each end.
      STOP_AT: ${STOP_AT:-6.0}
      RETURN_TO: ${RETURN_TO:-1.5}
      # About-face tuning. The log prints commanded vs actual yaw rate during
      # the turn: if actual stays well below commanded, the policy is saturated
      # and raising TURN_WZ further will not help.
      # The policy turns by stepping: with little forward speed it plants both
      # feet and stops rotating, whatever yaw is asked. TURN_VX is therefore the
      # lever that matters, at the cost of the turn sweeping sideways; the line
      # following pulls the robot back onto the axis afterwards.
      TURN_WZ: ${TURN_WZ:-0.9}
      # Below about 0.25 m/s this policy stops stepping and the turn stalls, so
      # this is close to the floor: tighten the arc with TURN_WZ, not by slowing.
      TURN_VX: ${TURN_VX:-0.26}
      # How straight the robot stays while rejoining the axis: lower looks like
      # a correction, higher looks like it walked off diagonally.
      CROSS_MAX: ${CROSS_MAX:-0.35}
      # Lane offset either side of the optical axis, half the turn diameter, so
      # each about-face lands on the opposite lane with nothing to correct.
      # LANE=0 puts the robot back on a single centred line.
      # Starting value only: the sim measures how far each turn actually sweeps
      # and converges the lane onto it within a lap or two.
      LANE: ${LANE:-0.39}
      # How close a corner has to be before the robot turns onto the next edge.
      CORNER_R: ${CORNER_R:-0.5}
      # How much the controller ignores the gait's own sway. Longer is calmer
      # but slower to correct a real drift.
      SMOOTH_TAU: ${SMOOTH_TAU:-0.5}
      # Distance over which a lateral error is corrected. Longer is calmer:
      # the heading loop needs to be much faster than this one or they oscillate.
      LOOKAHEAD: ${LOOKAHEAD:-2.0}
      YAW_DAMP: ${YAW_DAMP:-0.5}
      # Walking speed along the axis. The policy was trained around 0.5-0.8 m/s,
      # so it is steadier here than at a crawl.
      CRUISE_VX: ${CRUISE_VX:-0.6}
      PHYSICS_HZ: "1000"
      CONTROL_HZ: "50"
      PUBLISH_HZ: "60"
      POLICY_PATH: /policies/g1_walker/walker.onnx
      OV_DEVICE: ${OV_DEVICE:-GPU}
    devices:
      - /dev/dri:/dev/dri
      # The NPU lives on /dev/accel, not /dev/dri. Without it the policy
      # cannot see the NPU at all and silently falls back to the CPU,
      # whatever OV_DEVICE says. perception already mounts it.
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./models:/models:ro
      - ./policies:/policies:ro
    restart: unless-stopped

  # Rendering to the TV. Needs the host X socket and the Intel iGPU.
  # Source. The single camera owner: reads RGB + depth and broadcasts each on
  # its own bus channel with a shared timestamp. Needs the privileged USB access
  # librealsense requires.
  source:
    build:
      context: .
      dockerfile: services/source/Dockerfile
    depends_on:
      - bus
    privileged: true
    environment:
      # Straighten the floor boundary: stereo depth is noisy where the floor
      # meets a wall, so the raw edge wobbles although the real one is a line.
      # STRAIGHTEN=0 keeps the raw boundary; STRAIGHTEN_TOL raises or lowers how
      # aggressively the contour is simplified.
      STRAIGHTEN: ${STRAIGHTEN:-1}
      STRAIGHTEN_TOL: ${STRAIGHTEN_TOL:-0.012}
      <<: *bus-env
      SOURCE_CONFIG: /config/streams.d455.json
      DISPLAY: ${DISPLAY:-:0}
      # The RealSense spatial/temporal/hole-filling filters. Set to 0 to see the
      # raw depth, which is full of holes on glossy floors.
      DEPTH_FILTERS: "1"
    volumes:
      - ./config:/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

  compositor:
    build:
      context: .
      dockerfile: services/compositor/Dockerfile
    depends_on:
      - bus
      - source
    # No camera: the compositor receives RGB + depth from the source over the
    # bus. It only needs the GPU for rendering and the display.
    environment:
      # Distance kept from the floor's edge while walking its perimeter.
      ROI_MARGIN: ${ROI_MARGIN:-0.45}
      # Straighten the floor boundary: stereo depth is noisy where the floor
      # meets a wall, so the raw edge wobbles although the real one is a line.
      # STRAIGHTEN=0 keeps the raw boundary; STRAIGHTEN_TOL raises or lowers how
      # aggressively the contour is simplified.
      STRAIGHTEN: ${STRAIGHTEN:-1}
      STRAIGHTEN_TOL: ${STRAIGHTEN_TOL:-0.012}
      # Height of the G1 in its walking pose, used only by the 'h' scale check.
      ROBOT_HEIGHT: "1.31"
      # Supersampling of the robot render. The silhouette gets scale^2 coverage
      # levels per output pixel: 4 at scale 2, 9 at scale 3, 16 at scale 4.
      # Cost grows with the square, and so does the offscreen buffer.
      RENDER_SCALE: ${RENDER_SCALE:-3}
      <<: *bus-env
      ROBOT: g1_walker
      DISPLAY: ${DISPLAY:-:0}
      # GLFW creates the visible GL context (validated: GL 4.6 + FBO on the host).
      # MuJoCo renders into that current context. MUJOCO_GL=glx matches the GLX
      # context GLFW provides on X11; EGL was a wrong turn (gladLoadGL error).
      MUJOCO_GL: glx
      LIBVA_DRIVER_NAME: iHD
      INTEL_FORCE_PROBE: "0xb080"
      XDG_RUNTIME_DIR: /tmp/runtime-compositor
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/models:ro
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped

  # Perception. Receives camera frames from the compositor over the bus and runs
  # detection; it no longer opens the camera itself.
  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      PERCEPTION_CONFIG: /config/streams.d455.json
    devices:
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./config:/config:ro
      - ./assets:/assets:ro
    restart: unless-stopped

  # Recorder. Persists calibration and runtime telemetry to a SQLite file on a
  # mounted volume. Passive: subscribes only to small messages, never the camera.
  recorder:
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      RECORDER_DB: /data/edgebot.sqlite
      RECORD_HZ: "3"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped
