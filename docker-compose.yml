name: edge-ai-robotics

x-bus-env: &bus-env
  BUS_PUB: tcp://bus:5555
  BUS_SUB: tcp://bus:5556
  PYTHONUNBUFFERED: "1"

# Resolution du capteur. C'est un reglage QUI PORTE LA CALIBRATION, pas une
# preference d'affichage : fx, fy, ppx, ppy sont exprimes dans un raster
# precis, et 1280x720 n'est pas un 640x480 agrandi (rapport d'aspect different,
# crop capteur different). Changer STREAM_RES invalide donc
# config/camera_calibration.json ET config/floor_mask.png ; il faut relancer
#     make calibrate HEIGHT=<metres>
# Les trois services qui doivent etre d'accord le lisent d'ici, via
# common/edgebot/camera.py : source ouvre le capteur, calibrate le rouvre pour
# lire les intrinseques, compositor dimensionne sa fenetre dessus.
#
# Le cout mesure des deux modes (encode, travail par image, debit bus, latence
# web bout en bout) est dans docs/WEB-CONSOLE.md, avec la ligne de reference
# d'avant le changement.
x-camera-env: &camera-env
  STREAM_RES: ${STREAM_RES:-720p}

services:

  # Message broker. Every other service connects here, so adding perception
  bus:
    build:
      context: .
      dockerfile: services/bus/Dockerfile
    environment: *bus-env
    expose:
      - "5555"
      - "5556"
    restart: unless-stopped

  # Physics. CPU only — MuJoCo's solver does not use the GPU, which is what
  # leaves the iGPU free for rendering and, later, perception.
  sim:
    build:
      context: .
      dockerfile: services/sim/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      POLICY: rl
      # "lateral" paces across the view at a constant distance, so the robot
      # keeps the same apparent size; "axial" walks along the optical axis.
      # The robot paces the optical axis between these two limits, turning on
      # the spot at each end.
      STOP_AT: ${STOP_AT:-6.0}
      # The walkable floor starts at 1.7 m (the floor polygon shrunk by
      # ROI_MARGIN), so a near limit of 1.5 turned the robot around 20 cm
      # outside it, on ground it had no depth evidence for.
      RETURN_TO: ${RETURN_TO:-1.9}
      # About-face tuning. The log prints commanded vs actual yaw rate during
      # the turn: if actual stays well below commanded, the policy is saturated
      # and raising TURN_WZ further will not help.
      # The policy turns by stepping: with little forward speed it plants both
      # feet and stops rotating, whatever yaw is asked. TURN_VX is therefore the
      # lever that matters, at the cost of the turn sweeping sideways; the line
      # following pulls the robot back onto the axis afterwards.
      TURN_WZ: ${TURN_WZ:-0.9}
      # Below about 0.25 m/s this policy stops stepping and the turn stalls, so
      # this is close to the floor: tighten the arc with TURN_WZ, not by slowing.
      TURN_VX: ${TURN_VX:-0.26}
      # How straight the robot stays while rejoining the axis: lower looks like
      # a correction, higher looks like it walked off diagonally.
      CROSS_MAX: ${CROSS_MAX:-0.35}
      # Lane offset either side of the optical axis, half the turn diameter, so
      # each about-face lands on the opposite lane with nothing to correct.
      # LANE=0 puts the robot back on a single centred line.
      # Starting value only: the sim measures how far each turn actually sweeps
      # and converges the lane onto it within a lap or two.
      LANE: ${LANE:-0.39}
      # Une empreinte doit apparaitre dans les CONFIRM_MIN dernieres mises a
      # jour sur CONFIRM_OF avant que le robot n'y reagisse. Les detections
      # clignotent, et reagir a une seule trame le faisait fuir un obstacle
      # imaginaire toutes les 11 secondes.
      # Duree de validite d'une empreinte. Doit depasser ROI_PERIOD, sinon les
      # obstacles perimenent entre deux messages et la voie revient dedans.
      OBSTACLE_STALE: ${OBSTACLE_STALE:-3.0}
      CONFIRM_OF: ${CONFIRM_OF:-3}
      CONFIRM_MIN: ${CONFIRM_MIN:-3}
      # D'ou viennent les obstacles : "ours" (nos empreintes, le defaut et la
      # demo livree), "suite" (les clusters d'ADBSCAN seuls) ou "union".
      # L'union parce que les deux detecteurs sont complementaires, mesure et
      # non suppose : nous tenons la table et le bloc cuisine qu'ils fondent en
      # une masse, ils tiennent le pilier et le comptoir proches droite dont
      # aucune classe COCO ne nous donne d'empreinte. Voir
      # docs/ETAPE-C-RESULTS.md section 8. Defaut "ours" : les briques de la
      # suite sont un profil optionnel, et le comportement du navigateur ne
      # doit pas dependre de ce qui tourne par ailleurs.
      OBSTACLE_SOURCE: ${OBSTACLE_SOURCE:-ours}
      # "patrol" arpente l'axe optique, la demo livree. "goal" suit les points
      # de SUITE_PATH, la sortie du planificateur, c'est l'etape E2. Defaut
      # patrol : le planificateur est un profil optionnel.
      NAV_MODE: ${NAV_MODE:-patrol}
      # Tolerance d'arrivee. Ce n'est pas une marge de confort, c'est le
      # decalage mesure du roadmap ITS : il accroche son depart au noeud le plus
      # proche, 0,30 a 0,45 m. Resserrer mesurerait la densite du roadmap, pas
      # le suivi du robot.
      GOAL_TOL: ${GOAL_TOL:-0.45}
      PATH_LOOKAHEAD: ${PATH_LOOKAHEAD:-0.8}
      PATH_STALE: ${PATH_STALE:-20.0}
      # Leurs clusters uniquement. Rogne a l'arene, puis tout ce qui depasse
      # SUITE_MAX_SPAN dans une direction est refuse avant la fusion : ils
      # rendent encore la moitie droite de la piece en un bloc de 3,8 x 2,2 m
      # dans 68-82 % des trames, et le donner au detour murerait la moitie de
      # la patrouille. 3 m est au-dessus du plus grand meuble d'ici (la table
      # de 2,64 m) et en dessous de ce bloc.
      SUITE_MAX_SPAN: ${SUITE_MAX_SPAN:-3.0}
      SUITE_X_MIN: ${SUITE_X_MIN:-1.5}
      SUITE_X_MAX: ${SUITE_X_MAX:-6.5}
      SUITE_Y_MIN: ${SUITE_Y_MIN:--2.6}
      SUITE_Y_MAX: ${SUITE_Y_MAX:-1.5}
      # Demi-largeur du robot aux epaules. Le G1 fait ~0,45 m, donc 0,22.
      ROBOT_HALF_WIDTH: ${ROBOT_HALF_WIDTH:-0.22}
      # LA marge, et la seule. Metres de sol reel laisses entre le corps du
      # robot et tout ce qui bloque, appliques EXACTEMENT UNE FOIS, par le
      # compositeur au moment ou il rasterise l'obstacle : chaque cellule
      # occupee et chaque rectangle publie la portent deja. Tout consommateur
      # teste donc a sa propre demi-largeur et n'ajoute rien.
      #
      # Elle remplace trois reglages qui s'empilaient sans que personne ne les
      # additionne :
      #   OBSTACLE_MARGIN 0,12  dans la grille, deux cotes           0,24
      #   LANE_SLACK      0,08  sur la demi-largeur dans free_lane   0,16
      #   robot                                                      0,44
      #                                              couloir exige   0,84 m
      # plus, un fichier plus loin, un seuil de fusion qui posait une autre
      # question encore : need = 2 x (ROBOT_HALF_WIDTH + GAP_CLEAR) = 0,64 m
      # mesures entre des rectangles portant deja 0,12 chacun, soit 0,88 m de
      # sol reel. Deux chemins, deux reponses, aucune ecrite en metres.
      #
      # Les couloirs de part et d'autre de la table basse mesurent 0,90 m. Le
      # robot refusait donc des passages qu'un humain traverse, avec 0,03 m de
      # reste sur un chemin et -0,02 m sur l'autre.
      #
      # Maintenant : couloir = 2 x (ROBOT_HALF_WIDTH + CLEARANCE) = 0,68 m, une
      # seule expression, journalisee en metres au demarrage du navigateur.
      # Monter CLEARANCE ELARGIT le couloir exige, ce qui est le sens
      # intuitif -- GAP_CLEAR allait dans l'autre sens et c'est la moitie de la
      # raison pour laquelle il a ete mal regle deux fois.
      #
      # Une seule declaration pour toute la pile : le compositeur, le
      # navigateur et les deux bridges suite lisent CE nom. OBSTACLE_MARGIN
      # etait repete dans trois services avec, dans chacun, un commentaire
      # demandant au lecteur suivant de les garder egaux.
      CLEARANCE: ${CLEARANCE:-0.12}
      # OU la marge est appliquee. "query" : la grille publiee reste une carte
      # BRUTE des obstacles et chaque requete de couloir demande
      # demi-largeur + CLEARANCE. "dilate" : les cellules sont grossies a la
      # construction et la requete demande la demi-largeur nue.
      #
      # Les deux exigent le MEME couloir de sol reel. Ils ne font pas le meme
      # test pour autant : la dilatation est une somme de Minkowski avec une
      # ELLIPSE, donc elle arrondit les coins et decrit un robot CIRCULAIRE,
      # tandis que la requete grossit le rectangle balaye et decrit un robot
      # RECTANGULAIRE. En diagonale apres un coin le disque est le plus
      # permissif des deux.
      #
      # Et surtout la dilatation DETRUIT DE L'INFORMATION : une grille gonflee
      # ne peut plus etre interrogee a une autre largeur, ce qui est le
      # mecanisme par lequel la sonde et le navigateur ne pouvaient pas etre
      # d'accord. Une couche d'obstacles brute avec l'inflation a la requete
      # est aussi ce que fait Nav2, donc l'etape 4 en profite.
      # Comparees sur la meme grille par scripts/clearance_probe.py.
      CLEARANCE_MODE: ${CLEARANCE_MODE:-query}
      OBSTACLE_LOOK: ${OBSTACLE_LOOK:-3.5}
      DETOUR_MAX: ${DETOUR_MAX:-1.8}
      # Sur quoi le robot pilote : "grid" = cellules d'occupation au sol,
      # "rects" = les rectangles d'empreinte, l'ancien comportement.
      #
      # grid par defaut, sur mesure et non par gout. Le rectangle autour du
      # canape en L de ce salon faisait 3,35 x 3,19 m = 10,7 m2 pour un canape
      # occupant environ 5,1 m2 ; les 5,6 m2 avales etaient la table basse et
      # les deux couloirs. Le decouper en plusieurs rectangles ameliore la
      # couverture mais ne libere jamais l'interieur du L : le budget finit
      # toujours par un rectangle qui traverse le passage. Une cellule est
      # occupee ou elle ne l'est pas, la question ne se pose plus.
      #
      # Les deux representations partent sur chaque message, donc "rects"
      # restaure exactement l'ancien comportement et les deux restent
      # comparables sur la meme scene.
      OBSTACLE_REP: ${OBSTACLE_REP:-grid}
      # Cellule de la grille au sol, en metres. Reglage et non constante
      # depuis docs/SURPROJECTION-RESULTS.md : a 0,05 m la rasterisation
      # annoncait un passage 0,060 m plus etroit qu il ne l est (mediane sur
      # 706 travees), avec une queue non bornee -- p99 +0,430 m, pire +0,500.
      # Une travee reelle de 0,15 m DISPARAIT a 0,05 m ; a 0,02 m il lui faut
      # descendre sous 0,06 m. Cout chiffre avant le changement :
      # points_to_grid 1,45 -> 1,98 ms, bus 3,1 -> 19,5 ko, fermeture
      # GRID_PASSABLE 0,07 -> 2,47 ms, le tout a 0,99 Hz.
      # Le compositeur REFUSE de tourner si la cellule est plus fine que
      # l espacement mesure du nuage : c est le piege qui a fait publier un
      # chiffre faux, et il ne s annonce pas tout seul.
      GRID_CELL: ${GRID_CELL:-0.02}
      # Ramene le demi-tour dans le sol que le capteur rapporte vraiment.
      # STOP_AT=6.0 date d'une scene dont le sol allait plus loin : sur celle-ci
      # il ordonnait quatre metres de marche entierement dans les empreintes,
      # mesure a 100 % de poses en raclage et -0,522 m de clairance. C'etait de
      # l'obeissance a un ordre impossible, pas un echec de contournement.
      # Marge en metres avant le bord du sol observe. 0 desactive.
      PATROL_CLAMP: ${PATROL_CLAMP:-0.6}
      # LANE_SLACK se trouvait ici : une demi-largeur supplementaire sur
      # chaque test de voie, 0,08 par defaut. Ce n'etait pas une marge de
      # securite -- son propre commentaire le disait -- mais le paiement du
      # RETARD DE POURSUITE : la voie est atteinte asymptotiquement, donc une
      # voie choisie avec exactement la clairance necessaire est toujours
      # abordee avec moins. Supprime avec la mesure comme arbitre : _runup_cap
      # resout le meme probleme en FREINANT quand l'elan est trop court, au
      # lieu d'exiger une voie plus large partout. Voir navigator.py.
      # Plancher du frein d'elan. Pas zero : un robot qui s'arrete devant un
      # obstacle dont il s'ecarte encore ne finit jamais de s'en ecarter, la
      # loi de cross-track ayant besoin d'avancer pour convertir un cap en
      # deplacement lateral.
      RUNUP_MIN: ${RUNUP_MIN:-0.25}
      # Plancher de vitesse en m/s ABSOLUS, applique dans _smooth, le seul
      # entonnoir par lequel passe toute sortie du navigateur.
      # 0,45 = le seuil de DEMARRAGE mesure (0,42, scripts/startup_probe.py)
      # plus une marge. Ce seuil n'est pas celui d'ARRET, mesure a 0,26 : il y a
      # 0,16 m/s d'hysteresis entre les deux, et TURN_VX=0.26 est pile du mauvais
      # cote. Toute commande dans [0,26 ; 0,42) maintient un robot qui marche et
      # ne peut pas relancer un robot arrete -- (0,26 ; 0) est un point fixe
      # stable, et c'est ainsi que la patrouille s'est figee au lap 18.
      # En m/s absolus et NON en fraction d'un autre reglage : la forme
      # precedente valait RUNUP_MIN x CRUISE_VX = 0,25 x 0,6 = 0,15 m/s, donc
      # c'est le reglage voisin qui l'avait tire sous le seuil.
      START_VX: ${START_VX:-0.45}
      # Chien de garde : commande non nulle qui deplace de moins de
      # STALL_MIN_MOVE metres sur STALL_WINDOW secondes -> WARNING nommant la
      # valeur commandee. Mesure sur le centre du robot et non sur l'orteil,
      # qui oscille a chaque pas et se lirait comme un deplacement.
      STALL_MIN_MOVE: ${STALL_MIN_MOVE:-0.05}
      STALL_WINDOW: ${STALL_WINDOW:-2.0}
      # How much the controller ignores the gait's own sway. Longer is calmer
      # but slower to correct a real drift.
      SMOOTH_TAU: ${SMOOTH_TAU:-0.5}
      # Distance over which a lateral error is corrected. Longer is calmer:
      # the heading loop needs to be much faster than this one or they oscillate.
      LOOKAHEAD: ${LOOKAHEAD:-2.0}
      YAW_DAMP: ${YAW_DAMP:-0.5}
      # Walking speed along the axis. The policy was trained around 0.5-0.8 m/s,
      # so it is steadier here than at a crawl.
      CRUISE_VX: ${CRUISE_VX:-0.6}
      PHYSICS_HZ: "1000"
      CONTROL_HZ: "50"
      PUBLISH_HZ: "60"
      POLICY_PATH: /policies/g1_walker/walker.onnx
      OV_DEVICE: ${OV_DEVICE:-NPU}
    devices:
      - /dev/dri:/dev/dri
      # The NPU lives on /dev/accel, not /dev/dri. Without it the policy
      # cannot see the NPU at all and silently falls back to the CPU,
      # whatever OV_DEVICE says. perception already mounts it.
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./models:/models:ro
      - ./policies:/policies:ro
    restart: unless-stopped

  # Rendering to the TV. Needs the host X socket and the Intel iGPU.
  # Source. The single camera owner: reads RGB + depth and broadcasts each on
  # its own bus channel with a shared timestamp. Needs the privileged USB access
  # librealsense requires.
  source:
    build:
      context: .
      dockerfile: services/source/Dockerfile
    depends_on:
      - bus
    privileged: true
    environment:
      # Straighten the floor boundary: stereo depth is noisy where the floor
      # meets a wall, so the raw edge wobbles although the real one is a line.
      # STRAIGHTEN=0 keeps the raw boundary; STRAIGHTEN_TOL raises or lowers how
      # aggressively the contour is simplified.
      STRAIGHTEN: ${STRAIGHTEN:-1}
      STRAIGHTEN_TOL: ${STRAIGHTEN_TOL:-0.012}
      <<: [*bus-env, *camera-env]
      SOURCE_CONFIG: /config/streams.d455.json
      # Rejouer un enregistrement au lieu d'ouvrir la camera. Vide = la camera,
      # le comportement livre. Chemin DANS le conteneur, donc sous /data :
      #     SOURCE_BAG=/data/salon.db3 docker compose up -d --build source
      # Rien en aval ne le sait : memes topics, memes cles de charge utile,
      # meme horodatage partage. Ce n'est pas un second chemin de code, c'est
      # de quoi travailler sur le compositeur, le navigateur et les sondes sans
      # le materiel.
      #
      # LE RASTER EST LE PIEGE. config/camera_calibration.json decrit UNE piece
      # a UNE resolution. Un bag a un autre raster rend fausses toutes les
      # distances en aval alors que l'image se compose encore et que l'overlay
      # peint encore quelque chose. Rien plus bas ne peut le detecter, donc
      # source.py le detecte au demarrage et l'ecrit en ERREUR.
      # Enregistrer avec : make record SECONDS=60 OUT=data/salon.db3
      SOURCE_BAG: ${SOURCE_BAG:-}
      # Rejouer au rythme enregistre (1) ou aussi vite que le fichier se lit
      # (0). Toute la pile est cadencee par l'arrivee des trames -- le FPS du
      # compositeur, ROI_PERIOD, OBSTACLE_STALE -- donc un bag lu a fond mesure
      # le lecteur et pas la demo.
      BAG_REAL_TIME: ${BAG_REAL_TIME:-1}
      DISPLAY: ${DISPLAY:-:0}
      # The RealSense spatial/temporal/hole-filling filters. Set to 0 to see the
      # raw depth, which is full of holes on glossy floors.
      # Reglable, contrairement a ce que la valeur en dur laissait croire :
      # le commentaire ci-dessus dit "mettre a 0 pour voir la profondeur
      # brute" et ce n'etait pas possible sans editer ce fichier. Trouve en
      # voulant chiffrer la part des filtres dans la sur-projection de
      # 0,15 m, qui se mesure precisement en les eteignant.
      DEPTH_FILTERS: ${DEPTH_FILTERS:-1}
    volumes:
      - ./config:/config
      # Necessaire au calibrage assiste : `calibrate.py --dump-frame` ecrit les
      # trames ici et le conteneur `perception` les relit pour en tirer le
      # masque de meubles. Sans ce montage elles etaient ecrites dans le
      # systeme de fichiers du conteneur et disparaissaient avec `run --rm`,
      # et l'etape suivante ne trouvait rien.
      - ./data:/data
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

  compositor:
    build:
      context: .
      dockerfile: services/compositor/Dockerfile
    depends_on:
      - bus
      - source
    # No camera: the compositor receives RGB + depth from the source over the
    # bus. It only needs the GPU for rendering and the display.
    environment:
      # Distance kept from the floor's edge while walking its perimeter. It
      # costs twice this in each dimension, which on a 3 m region is a lot:
      # 0.45 turned a 3.3 by 3.4 m floor into a 2.4 by 2.5 m ring. Enough to
      # clear the robot's own width and the stereo noise at the boundary is
      # what is actually needed.
      ROI_MARGIN: ${ROI_MARGIN:-0.25}
      # LA marge unique, argumentee dans le bloc `sim` ci-dessus, et c'est ICI
      # qu'elle est appliquee : points_to_grid fait grossir chaque cellule
      # occupee de cette valeur, et chaque rectangle publie la porte aussi.
      # Elle part sur PATROL_ROI sous la cle `clearance`, pour que le
      # consommateur n'ait pas a la deviner ni a en appliquer une seconde.
      CLEARANCE: ${CLEARANCE:-0.12}
      # OU la marge est appliquee. "query" : la grille publiee reste une carte
      # BRUTE des obstacles et chaque requete de couloir demande
      # demi-largeur + CLEARANCE. "dilate" : les cellules sont grossies a la
      # construction et la requete demande la demi-largeur nue.
      #
      # Les deux exigent le MEME couloir de sol reel. Ils ne font pas le meme
      # test pour autant : la dilatation est une somme de Minkowski avec une
      # ELLIPSE, donc elle arrondit les coins et decrit un robot CIRCULAIRE,
      # tandis que la requete grossit le rectangle balaye et decrit un robot
      # RECTANGULAIRE. En diagonale apres un coin le disque est le plus
      # permissif des deux.
      #
      # Et surtout la dilatation DETRUIT DE L'INFORMATION : une grille gonflee
      # ne peut plus etre interrogee a une autre largeur, ce qui est le
      # mecanisme par lequel la sonde et le navigateur ne pouvaient pas etre
      # d'accord. Une couche d'obstacles brute avec l'inflation a la requete
      # est aussi ce que fait Nav2, donc l'etape 4 en profite.
      # Comparees sur la meme grille par scripts/clearance_probe.py.
      CLEARANCE_MODE: ${CLEARANCE_MODE:-query}
      # Idem cote compositor : les grilles sont construites ici et voyagent
      # sur PATROL_ROI a cote de `blocked`.
      OBSTACLE_REP: ${OBSTACLE_REP:-grid}
      # Cellule de la grille au sol, en metres. Reglage et non constante
      # depuis docs/SURPROJECTION-RESULTS.md : a 0,05 m la rasterisation
      # annoncait un passage 0,060 m plus etroit qu il ne l est (mediane sur
      # 706 travees), avec une queue non bornee -- p99 +0,430 m, pire +0,500.
      # Une travee reelle de 0,15 m DISPARAIT a 0,05 m ; a 0,02 m il lui faut
      # descendre sous 0,06 m. Cout chiffre avant le changement :
      # points_to_grid 1,45 -> 1,98 ms, bus 3,1 -> 19,5 ko, fermeture
      # GRID_PASSABLE 0,07 -> 2,47 ms, le tout a 0,99 Hz.
      # Le compositeur REFUSE de tourner si la cellule est plus fine que
      # l espacement mesure du nuage : c est le piege qui a fait publier un
      # chiffre faux, et il ne s annonce pas tout seul.
      GRID_CELL: ${GRID_CELL:-0.02}
      # Ferme les fentes plus etroites que le robot. Une seule raison d'exister
      # et elle est locale : les pieds d'un tabouret se projettent en deux
      # taches avec du vrai sol entre elles, mais 0,35 m n'est pas un passage
      # pour un robot de 0,44 m. C'est le seul role legitime que la fusion des
      # empreintes du navigator remplissait, fait ici ou c'est un fait
      # morphologique local et non une fusion globale qui reconstruisait la
      # boite englobante que la decomposition existait pour eviter.
      GRID_PASSABLE: ${GRID_PASSABLE:-0.44}
      # Rasterise un pixel de sol sur N dans chaque direction. 1 = tous.
      # A 1 PARCE QUE LA MESURE L'A DIT. Le masque de sol de ce salon porte
      # 284 656 pixels pour 5120 cellules, soit 55,6 points par cellule en
      # moyenne -- ce qui ressemble a du gaspillage jusqu'a ce qu'on regarde la
      # repartition. La densite de points decroit en 1/z^2 : le sol proche
      # recoit des milliers de points par cellule et le sol lointain un ou
      # deux, donc un pas uniforme en pixels supprime les cellules lointaines.
      # Il n'en ajoute jamais, il n'en enleve que -- et il les enleve au bord
      # lointain, exactement la ou se mesure le sol praticable :
      #   pas 2 : 1,52 ms, 4975 cellules, 145 perdues (2,8 %)
      #   pas 4 : 0,38 ms, 4045 cellules, 1075 perdues (21,0 %)
      #   pas 8 : 0,16 ms, 2604 cellules, 2516 perdues (49,1 %)
      # En face, le gain : ce calcul tourne une fois par publication de ROI,
      # mesure a 0,99 Hz sur 10 minutes. 8,9 ms une fois par seconde, c'est
      # 0,9 % du temps et une image sur 37 : ca deplace le p99, pas le FPS.
      # Les objets ne sont deliberement PAS sous-echantillonnes : une cellule
      # de sol perdue coute au robot un endroit ou il aurait pu marcher, une
      # cellule d'objet perdue l'envoie dans le meuble.
      FLOOR_STRIDE: ${FLOOR_STRIDE:-1}
      # Borne chaque empreinte par la profondeur MESUREE de l'objet, au lieu de
      # projeter sa silhouette sur le plan du sol. La projection repond "si ce
      # pixel etait au sol, ou serait-il", ce qui fuit vers l'infini pour tout
      # ce qui est au-dessus du sol : un canape de 0,9 m de profondeur contre un
      # mur mesure a 6,2 m ressortait en empreinte de 4,4 m atteignant 6,6 m,
      # donc au-dela du mur -- c'est a ca qu'on voit qu'on mesurait la
      # projection et pas l'objet. Mettre 0 pour revenir a la projection.
      FOOTPRINT_FROM_DEPTH: ${FOOTPRINT_FROM_DEPTH:-1}
      # Au plus N rectangles par objet, couvrant seulement les cellules qu'il
      # occupe reellement. 1 revient a la boite englobante unique, qui
      # revendique l'interieur d'une forme concave : le rectangle autour d'un
      # canape en L possede le sol libre dans le creux du L. La couverture est
      # toujours complete -- le dernier rectangle englobe ce qui reste -- parce
      # qu'une carte d'obstacles qui oublie une cellule envoie le robot dans le
      # meuble, alors qu'une qui en couvre un peu trop le fait seulement
      # contourner du vide.
      FOOTPRINT_MAX_RECTS: ${FOOTPRINT_MAX_RECTS:-24}
      FOOTPRINT_CELL: ${FOOTPRINT_CELL:-0.06}
      # Periode de republication du sol praticable et des empreintes.
      ROI_PERIOD: ${ROI_PERIOD:-1.0}
      # Mur du fond mesure a 6,2 m. La projection au sol ne sait pas ou la
      # piece s'arrete : une colonne de masque egaree a produit une empreinte
      # publiee jusqu'a 11,12 m. Meme garde que GF_X_MAX cote pont.
      FOOTPRINT_X_MAX: ${FOOTPRINT_X_MAX:-6.5}
      # Straighten the floor boundary: stereo depth is noisy where the floor
      # meets a wall, so the raw edge wobbles although the real one is a line.
      # STRAIGHTEN=0 keeps the raw boundary; STRAIGHTEN_TOL raises or lowers how
      # aggressively the contour is simplified.
      STRAIGHTEN: ${STRAIGHTEN:-1}
      STRAIGHTEN_TOL: ${STRAIGHTEN_TOL:-0.012}
      # Height of the G1 in its walking pose, used only by the 'h' scale check.
      ROBOT_HEIGHT: "1.31"
      # Supersampling of the robot render. The silhouette gets scale^2 coverage
      # levels per output pixel: 4 at scale 2, 9 at scale 3, 16 at scale 4.
      # Cost grows with the square, and so does the offscreen buffer.
      # 2, pas 3. Le hors-ecran fait fenetre x RENDER_SCALE dans les deux
      # dimensions, donc le cout croit au carre : a 1280x720 un scale de 3
      # demanderait 3840x2160 alors que le compositeur tenait deja tout juste
      # dans son budget de 33 ms a 480p (30,4 ms mesures). A 2 le hors-ecran
      # fait 2560x1440, soit MOINS de pixels que les 2880x2160 d'avant, et le
      # travail par image descend a 24,9 ms tout en montant en resolution.
      RENDER_SCALE: ${RENDER_SCALE:-2}
      # Diagnostics, off by default. DIAG_FRAMES is a COUNT: the compositor
      # writes that many annotated frames to /data and then stops for good.
      # SHOW_FLOOR=1 starts with the 'f' overlays already on, so a capture can
      # be scripted without a keyboard. Both exist for the etape B figures, see
      # docs/ETAPE-B-RESULTS.md.
      DIAG_FRAMES: ${DIAG_FRAMES:-0}
      SHOW_FLOOR: ${SHOW_FLOOR:-0}
      # SHOW_OBJECTS=1 demarre la superposition 's' : silhouettes de
      # segmentation, boites, nom de classe et score. Repond a "pourquoi il n'a
      # pas evite ca" en montrant ce que le modele a etiquete, et surtout ce
      # qu'il n'a pas etiquete. 's' bascule toujours a la volee.
      SHOW_OBJECTS: ${SHOW_OBJECTS:-0}
      # Score en dessous duquel une detection n'est pas dessinee. Zero par
      # defaut : le detecteur applique deja son propre seuil `confidence` de
      # config/streams.d455.json, et un second seuil ici ne ferait que cacher a
      # l'ecran des detections bel et bien publiees. L'ancienne valeur en dur de
      # 0,45 masquait exactement les etiquettes faibles qui renseignent, une
      # table basse a 0,13 par exemple.
      SHOW_OBJECTS_CONF: ${SHOW_OBJECTS_CONF:-0}
      # Contours du masque plutot que rectangles. Une boite autour du canape en
      # L couvre la table basse et les deux couloirs qu'il entoure, mesure a
      # 3,35 x 3,19 m revendiques pour environ 5,1 m2 de meuble. Tout l'aval
      # travaille deja sur la silhouette : empreintes au sol, grille
      # d'occupation et masque de sol en viennent tous. Mettre a 1 pour revoir
      # le rectangle, utile seulement pour deboguer le repli sans masque.
      SHOW_OBJECT_BOXES: ${SHOW_OBJECT_BOXES:-0}
      # Hauteur minimale au-dessus du plan du sol calibre pour qu'un pixel du
      # masque compte comme objet. Le bus porte UNE silhouette d'union, reduite,
      # donc la frontiere entre deux objets voisins dans l'image est quantifiee
      # et les cellules a cheval lisent la profondeur de ce qui est derriere,
      # c'est-a-dire le sol entre les deux meubles. Elles etaient rasterisees en
      # sol occupe : un couloir reel de 0,9 m entre la table basse et le canape
      # etait comble ainsi. La profondeur separe deja les objets, chaque pixel
      # etant place par sa PROPRE distance mesuree ; il manquait seulement de
      # refuser les pixels qui mesurent a hauteur de sol. Meme 0,08 m que le
      # critere de sol, pour qu'un pixel ne puisse pas etre sol pour un test et
      # objet pour l'autre.
      OBJECT_Z_MIN: ${OBJECT_Z_MIN:-0.08}
      # Distance minimale a laquelle un obstacle peut etre rasterise. La bande
      # utile de la D455 sur ce montage commence vers 1,5 m, le bruit stereo
      # croit comme le carre de la portee. Une cellule revendiquee a 1,2 m est
      # du bruit ou une fausse detection posee sur le carrelage nu, et elle
      # tombe pile dans le chemin du robot. Mesure ici : grille annoncee a
      # 1,2-7,8 m dans une piece dont le mur du fond est a 6,2 m. La borne
      # LOINTAINE est FOOTPRINT_X_MAX, que les rectangles portaient deja par
      # clip_footprints alors que la grille, sur laquelle le navigateur pilote
      # vraiment, n'avait aucun garde-fou.
      OBSTACLE_X_MIN: ${OBSTACLE_X_MIN:-1.4}
      # Hauteur minimale, au-dessus du plan du sol calibre, qu'un point vu par
      # la camera doit avoir pour pouvoir masquer le robot. Le sol ne peut pas
      # masquer un robot qui marche dessus : au contact les deux profondeurs se
      # rejoignent et le test bascule sur le desaccord entre les deux sources.
      # Mesure ici : la semelle est rendue a 2,168 m, exactement la ou la
      # calibration place le sol pour ce pixel, et la D455 lit 1,97-2,00 m.
      # L'origine est un residu de calibration (plan ajuste a 14,67 deg / 1,503 m
      # contre 14,08 deg / 1,560 m) amplifie par l'incidence rasante en bas de
      # l'image. 0,25 m couvre les 0,11-0,14 m observes avec de la marge sans
      # desactiver l'occlusion reelle : une personne ou une chaise coupe
      # toujours le robot. DEPTH_PROBE=3 remesure tout ca.
      FLOOR_OCCLUDE_H: ${FLOOR_OCCLUDE_H:-0.25}
      # DEPTH_PROBE est une PERIODE en secondes (0 = eteint) : il relit la
      # profondeur du robot sous les pieds et l'affiche a cote de celle de la
      # camera. Une lecture arriere bloque le pipeline GL, donc jamais par image.
      DEPTH_PROBE: ${DEPTH_PROBE:-0}
      # Maj+S ecrit l'image affichee ici. 'docs/images' parce que c'est deja ou
      # vivent les figures du projet ; une capture finit presque toujours dans
      # un document.
      SNAPSHOT_DIR: ${SNAPSHOT_DIR:-/docs/images}
      # Etat initial de l'affichage du nuage ('p') : 0 eteint, 1 par-dessus la
      # video, 2 nuage seul. Les deux etiquettes viennent des memes variables
      # que le pont, pour qu'elles ne puissent pas diverger.
      SHOW_CLOUD: ${SHOW_CLOUD:-0}
      # Etat initial de la carte FastMapping sous 'm' : 0 rien, 1 les cellules
      # occupees, 2 occupees et libres. Meme role que SHOW_FLOOR et SHOW_CLOUD,
      # une capture scriptable sans clavier. Touche distincte de 'p' : le nuage
      # dit "maintenant" et la carte "tout ce qui a ete vu", et les deux servent
      # en meme temps.
      SHOW_MAP: ${SHOW_MAP:-0}
      # web | glfw | both. "both" par defaut : la television continue de
      # marcher et le reseau local voit la meme image.
      #
      # LE MODE WEB A ENCORE BESOIN DE X. Il saute l'AFFICHAGE dans la fenetre,
      # pas le rendu : MuJoCo rend hors ecran via GLX ici (EGL echoue sur ce
      # pilote), et la fenetre GLFW porte le contexte GL -- ce pilote refuse de
      # rendre un contexte courant sur une fenetre X non mappee. La session X
      # et `xhost +local:root` restent donc necessaires pour RENDRE, pas pour
      # REGARDER.
      DISPLAY_MODE: ${DISPLAY_MODE:-both}
      WEB_JPEG_QUALITY: ${WEB_JPEG_QUALITY:-80}
      # Fait attendre DIAG_FRAMES qu'un chemin soit arrive. Le chemin arrive
      # apres la carte, qui arrive apres les premieres trames annotees, donc
      # une capture scriptee ecrivait la carte sans le chemin.
      DIAG_WAIT_PATH: ${DIAG_WAIT_PATH:-0}
      GF_GROUND_LABEL: ${GF_GROUND_LABEL:-3}
      GF_OBSTACLE_LABEL: ${GF_OBSTACLE_LABEL:-5}
      # Meme valeur que pour le sim, sinon la superposition affirmerait une
      # entree que le robot ignore. En "union" le compositeur dessine en orange
      # les clusters d'ADBSCAN, apres le MEME rognage d'arene et le MEME rejet
      # au-dela de SUITE_MAX_SPAN que le navigateur applique -- dessiner le
      # topic brut montrerait un rectangle sur la moitie de la piece auquel le
      # robot ne reagit jamais.
      OBSTACLE_SOURCE: ${OBSTACLE_SOURCE:-ours}
      SUITE_MAX_SPAN: ${SUITE_MAX_SPAN:-3.0}
      SUITE_X_MIN: ${SUITE_X_MIN:-1.5}
      SUITE_X_MAX: ${SUITE_X_MAX:-6.5}
      SUITE_Y_MIN: ${SUITE_Y_MIN:--2.6}
      SUITE_Y_MAX: ${SUITE_Y_MAX:-1.5}
      <<: [*bus-env, *camera-env]
      ROBOT: g1_walker
      DISPLAY: ${DISPLAY:-:0}
      # GLFW creates the visible GL context (validated: GL 4.6 + FBO on the host).
      # MuJoCo renders into that current context. MUJOCO_GL=glx matches the GLX
      # context GLFW provides on X11; EGL was a wrong turn (gladLoadGL error).
      MUJOCO_GL: glx
      LIBVA_DRIVER_NAME: iHD
      INTEL_FORCE_PROBE: "0xb080"
      XDG_RUNTIME_DIR: /tmp/runtime-compositor
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/models:ro
      - ./config:/config:ro
      - ./data:/data
      # Maj+S ecrit la derniere image affichee ici.
      - ./docs:/docs
      # Pour que la date du fichier soit la bonne : sans ceci l'horloge du
      # conteneur est en UTC et une capture prise a 19 h serait classee a 17 h.
      # Verifie : le conteneur affichait 17:34 pendant que l'hote affichait
      # 19:34 CEST.
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro
    restart: unless-stopped

  # Perception. Receives camera frames from the compositor over the bus and runs
  # detection; it no longer opens the camera itself.
  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      PERCEPTION_CONFIG: /config/streams.d455.json
      # Seuil de detection. Vide = celui de config/streams.d455.json, a 0,10.
      # C'est le seul reglage qui decide si un obstacle faiblement reconnu
      # existe ou non : la table basse nappee de cette scene mesure 0,13, donc
      # 0,25 l'effacait. Monter cette valeur si la scene devient bruyante.
      PERCEPTION_CONF: ${PERCEPTION_CONF:-}
      # Resolution de la silhouette publiee. A 160x120 une cellule vaut 8 px en
      # 720p, donc la frontiere entre deux objets voisins DANS L'IMAGE est
      # quantifiee et les cellules a cheval sont allumees. 320x240 se compresse
      # a 9600 octets et divise l'erreur par deux.
      MASK_W: ${MASK_W:-320}
      MASK_H: ${MASK_H:-240}
    devices:
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./config:/config:ro
      - ./assets:/assets:ro
      # seg-test writes annotated frames here and, when run without --image,
      # opens the camera itself. Neither is needed by the service proper.
      - ./data:/data
    restart: unless-stopped

  # Recorder. Persists calibration and runtime telemetry to a SQLite file on a
  # mounted volume. Passive: subscribes only to small messages, never the camera.
  # Base commune aux briques de la suite : Ubuntu 24.04, ROS Jazzy, PCL, colcon,
  # pyzmq/msgpack. Ce n'est pas un service, il n'est jamais demarre : il existe
  # pour que compose sache construire l'image, et pour que les briques puissent
  # la nommer comme contexte de build (voir additional_contexts ci-dessous).
  # `command: ["true"]` plutot que rien, pour qu'un `up` accidentel se termine
  # immediatement au lieu de boucler sur un conteneur sans commande.
  # Troisieme consommateur prevu : FastMapping.
  ros-base:
    profiles: ["suite"]
    image: edge-ai-robotics-ros-base:jazzy
    build:
      context: .
      dockerfile: docker/ros-base/Dockerfile
    command: ["true"]

  # Intel Robotics AI Suite, brique 1 : segmentation du plan de sol.
  # Profil optionnel, la demo tourne sans. `make groundfloor` la demarre.
  groundfloor:
    profiles: ["suite"]
    build:
      context: .
      dockerfile: services/groundfloor/Dockerfile
      # Le Dockerfile dit `FROM edge-ai-robotics-ros-base:jazzy`, et cette ligne
      # detourne ce nom vers le service ros-base. Consequence : compose
      # (re)construit la base AVANT la brique. Sans ca, un `build groundfloor`
      # se contenterait de l'image locale du meme nom, aussi vieille soit-elle,
      # et une base perimee passerait inapercue sous une brique fraiche.
      additional_contexts:
        "edge-ai-robotics-ros-base:jazzy": "service:ros-base"
    depends_on: [bus, source]
    environment:
      BUS_PUB: tcp://bus:5555
      BUS_SUB: tcp://bus:5556
      PYTHONUNBUFFERED: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      # Doit valoir la meme chose que pour le reste du projet, sans quoi les
      # empreintes des deux cotes ne seraient pas comparables.
      GF_SENSOR_NAME: ${GF_SENSOR_NAME:-camera}
      # Publie la profondeur en RELIABLE. FastMapping s'abonne avec un
      # rclcpp::QoS(10) nu, donc RELIABLE, et n'expose AUCUN parametre pour en
      # changer : abonne fiable contre publieur best-effort, DDS n'apparie pas
      # et il ne recoit rien, en silence. La compatibilite est a sens unique, un
      # publieur fiable sert tres bien un abonne best-effort, donc c'est ici que
      # ca se corrige. Desactive par defaut : la fiabilite sur un flux capteur a
      # 30 Hz avec une file de 2 laisse un abonne lent freiner le publieur, et
      # ce risque appartient au profil qui en a besoin. `make fastmapping` le
      # met a 1.
      GF_DEPTH_RELIABLE: ${GF_DEPTH_RELIABLE:-0}
      # Classe du sol dans leur nuage etiquete. Mesuree, pas lue dans une
      # config : sur 1,5 M de points la classe 3 est a z median 0,060 m avec
      # 0,094 m d'ecart type, toutes les autres sont a 0,77 m ou plus.
      GF_GROUND_LABEL: ${GF_GROUND_LABEL:-3}
      GF_FLOOR_CELL: ${GF_FLOOR_CELL:-0.10}
      # LA marge unique, argumentee dans le bloc `sim` ci-dessus. Une seule
      # variable d'environnement pilote les quatre services qui la lisent,
      # ce qui est la garantie que OBSTACLE_MARGIN repete trois fois avec un
      # commentaire "gardez-les egaux" ne donnait pas.
      CLEARANCE: ${CLEARANCE:-0.12}
      # OU la marge est appliquee. "query" : la grille publiee reste une carte
      # BRUTE des obstacles et chaque requete de couloir demande
      # demi-largeur + CLEARANCE. "dilate" : les cellules sont grossies a la
      # construction et la requete demande la demi-largeur nue.
      #
      # Les deux exigent le MEME couloir de sol reel. Ils ne font pas le meme
      # test pour autant : la dilatation est une somme de Minkowski avec une
      # ELLIPSE, donc elle arrondit les coins et decrit un robot CIRCULAIRE,
      # tandis que la requete grossit le rectangle balaye et decrit un robot
      # RECTANGULAIRE. En diagonale apres un coin le disque est le plus
      # permissif des deux.
      #
      # Et surtout la dilatation DETRUIT DE L'INFORMATION : une grille gonflee
      # ne peut plus etre interrogee a une autre largeur, ce qui est le
      # mecanisme par lequel la sonde et le navigateur ne pouvaient pas etre
      # d'accord. Une couche d'obstacles brute avec l'inflation a la requete
      # est aussi ce que fait Nav2, donc l'etape 4 en profite.
      # Comparees sur la meme grille par scripts/clearance_probe.py.
      CLEARANCE_MODE: ${CLEARANCE_MODE:-query}
      # Retours physiquement impossibles, ecartes avant toute construction.
      # Mesures sur le nuage : z descendait a -6,096 m et x montait a 14,378 m
      # alors que le mur du fond est a 6,2 m.
      GF_Z_MIN: ${GF_Z_MIN:--0.3}
      GF_X_MAX: ${GF_X_MAX:-8.0}
      GF_PARAMS: ${GF_PARAMS:-/params/groundfloor_segmentation_params.yaml}
      # Copie sous-echantillonnee du nuage etiquete, pour l'affichage 'p' du
      # compositeur. 5000 points suffisent a montrer la structure de la piece
      # et se dessinent en ~1 ms ; les 200 k complets couteraient plus cher a
      # publier qu'a rendre.
      GF_CLOUD_MAX: ${GF_CLOUD_MAX:-5000}
      GF_CLOUD_HZ: ${GF_CLOUD_HZ:-2.0}
      GF_CLOUD_CELL: ${GF_CLOUD_CELL:-0.08}
    volumes:
      - ./config:/config:ro
      # Mounted rather than baked so max_surface_height can be changed and the
      # node restarted without rebuilding the 4.8 GB ROS image.
      - ./services/groundfloor/params:/params:ro

  # ADBSCAN, l'autre brique de la suite, meme profil que groundfloor. Elle
  # groupe les points en clusters d'obstacles : cette fois la cible de
  # comparaison est la bonne, nos empreintes et les siennes repondent a la meme
  # question.
  adbscan:
    profiles: ["suite"]
    build:
      context: .
      dockerfile: services/adbscan/Dockerfile
      # Meme detournement que pour groundfloor : la base est reconstruite avant
      # la brique, jamais reprise telle quelle depuis le cache local.
      additional_contexts:
        "edge-ai-robotics-ros-base:jazzy": "service:ros-base"
    # Depend sur groundfloor, pas seulement sur le bus : ADBSCAN est branche
    # sur /segmentation/obstacle_points, la sortie du noeud groundfloor. Son
    # unique seuil de hauteur ne peut pas enlever un sol vu par une camera
    # inclinee de 14 deg (le sol rampe sur 1,22 m de z dans l'arene), et le sol
    # restant ressortait comme un cluster de la taille de la piece.
    depends_on: [bus, source, groundfloor]
    environment:
      BUS_PUB: tcp://bus:5555
      BUS_SUB: tcp://bus:5556
      PYTHONUNBUFFERED: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      # Doit valoir la meme chose que pour le compositeur et groundfloor, sans
      # quoi les trois jeux d'empreintes ne sont pas comparables.
      GF_SENSOR_NAME: ${GF_SENSOR_NAME:-camera}
      GF_Z_MIN: ${GF_Z_MIN:--0.3}
      GF_X_MAX: ${GF_X_MAX:-8.0}
      # Tolerance au-dessus du sol pour le z_filter rendu au demarrage, voir
      # services/adbscan/params.yaml.in. Meme valeur que floor_h_tol_m.
      ADBSCAN_Z_TOL: ${ADBSCAN_Z_TOL:-0.08}
      # Interieur de l'arene. Le pont y decoupe le nuage de groundfloor avant
      # de le republier pour ADBSCAN : groundfloor enleve le sol, pas les murs,
      # et DBSCAN enchaine par contact -- une chaise contre le mur revient en
      # un seul bloc avec le mur. Volontairement PLUS LARGE que l'arene de
      # scripts/suite_compare.py (x 1.5-6.5, y -2.6 a 1.5), sans quoi la coupe
      # tronquerait les clusters que la comparaison note.
      # LA marge unique, argumentee dans le bloc `sim` ci-dessus. Une seule
      # variable d'environnement pilote les quatre services qui la lisent,
      # ce qui est la garantie que OBSTACLE_MARGIN repete trois fois avec un
      # commentaire "gardez-les egaux" ne donnait pas.
      CLEARANCE: ${CLEARANCE:-0.12}
      # OU la marge est appliquee. "query" : la grille publiee reste une carte
      # BRUTE des obstacles et chaque requete de couloir demande
      # demi-largeur + CLEARANCE. "dilate" : les cellules sont grossies a la
      # construction et la requete demande la demi-largeur nue.
      #
      # Les deux exigent le MEME couloir de sol reel. Ils ne font pas le meme
      # test pour autant : la dilatation est une somme de Minkowski avec une
      # ELLIPSE, donc elle arrondit les coins et decrit un robot CIRCULAIRE,
      # tandis que la requete grossit le rectangle balaye et decrit un robot
      # RECTANGULAIRE. En diagonale apres un coin le disque est le plus
      # permissif des deux.
      #
      # Et surtout la dilatation DETRUIT DE L'INFORMATION : une grille gonflee
      # ne peut plus etre interrogee a une autre largeur, ce qui est le
      # mecanisme par lequel la sonde et le navigateur ne pouvaient pas etre
      # d'accord. Une couche d'obstacles brute avec l'inflation a la requete
      # est aussi ce que fait Nav2, donc l'etape 4 en profite.
      # Comparees sur la meme grille par scripts/clearance_probe.py.
      CLEARANCE_MODE: ${CLEARANCE_MODE:-query}
      ARENA_X_MIN: ${ARENA_X_MIN:-1.2}
      ARENA_X_MAX: ${ARENA_X_MAX:-6.3}
      ARENA_Y_MIN: ${ARENA_Y_MIN:--2.8}
      ARENA_Y_MAX: ${ARENA_Y_MAX:-1.7}
      # Haut de la bande de residu du sol, retiree par le pont. Le plan estime
      # de groundfloor laisse une dispersion posee SUR le sol : 45 points par
      # nuage entre 0,08 et 0,12 m, dans 38 cellules de 10 cm, dont 71 % sans
      # rien au-dessus de 0,30 m -- donc du sol, pas des pieds de meubles. Leur
      # noeud coupe deja sous 0,08 m (z_filter), ce filtre enleve la tranche qui
      # reste. Le bas de la bande est 0 : les points SOUS le sol sont gardes
      # expres, ils font tomber un cluster dans le filtre "impossible" du pont
      # et c'est le signal que l'ajustement de plan derape. 0 pour desactiver.
      GF_Z_LOW: ${GF_Z_LOW:-0.12}
    volumes:
      - ./config:/config:ro

  # FastMapping, la troisieme brique et la premiere PERSISTANTE : groundfloor et
  # adbscan repondent a "qu'y a-t-il devant la camera maintenant" et recalculent
  # tout a chaque trame, celle-ci accumule. Troisieme consommateur de ros-base,
  # ce qui est la raison d'etre de cette image.
  fastmapping:
    profiles: ["suite"]
    build:
      context: .
      dockerfile: services/fastmapping/Dockerfile
      additional_contexts:
        "edge-ai-robotics-ros-base:jazzy": "service:ros-base"
    # Comme adbscan : depend de groundfloor, qui POSSEDE le chemin camera depuis
    # la refonte de l'etape C -- profondeur, camera_info et la TF. Cette brique
    # n'en publie aucun et les consomme tous les trois.
    depends_on: [bus, source, groundfloor]
    environment:
      BUS_PUB: tcp://bus:5555
      BUS_SUB: tcp://bus:5556
      PYTHONUNBUFFERED: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      GF_SENSOR_NAME: ${GF_SENSOR_NAME:-camera}
      # Leur defaut est "map", la convention SLAM : FastMapping est livre a cote
      # de RTAB-Map, qui publie map -> odom -> base_link. Ici il n'y a ni SLAM ni
      # odometrie, la camera est sur un trepied. base_link EST deja le repere
      # monde du projet, donc pour une camera fixe le repere carte et le repere
      # monde sont la meme chose. Voir entrypoint.sh.
      # "map" depuis l'etape E1, et non plus "base_link". Nav2 construit son
      # costmap dans "map" et demande a TF ou se trouve "base_link", qu'il
      # entend comme le CORPS DU ROBOT. Ici base_link est le monde, fixe. Les
      # deux sens sont reconcilies en les rendant numeriquement identiques :
      # la carte passe en "map" et itsplanner publie une TF statique identite
      # map -> base_link. Rien ne bouge geometriquement, seule l'etiquette
      # change. Voir services/itsplanner/bridge.py, et ce que E2 doit defaire.
      FM_MAP_FRAME: ${FM_MAP_FRAME:-map}
      # Leur defaut est 3,0 m, dimensionne pour un AMR qui cartographie le
      # couloir qu'il descend. Le mur du fond de cette piece est a 6,2 m et le
      # critere d'acceptation est justement de savoir si les murs apparaissent :
      # 3,0 trancherait la question avant la mesure.
      FM_MAX_DEPTH_RANGE: ${FM_MAX_DEPTH_RANGE:-7.0}
      # Bande de hauteur aplatie dans la grille 2D, en base_link donc en hauteur
      # au-dessus du sol. Leur fichier de lancement utilise 0,2 a 0,5, la hauteur
      # de pare-chocs d'un AMR. Ici elle doit contenir ce que le navigateur
      # appelle un obstacle : au-dessus du residu de plan (GF_Z_LOW = 0,12) et
      # jusqu'au-dessus d'un plateau de table.
      FM_PROJECTION_MIN_Z: ${FM_PROJECTION_MIN_Z:-0.15}
      FM_PROJECTION_MAX_Z: ${FM_PROJECTION_MAX_Z:-1.20}
      FM_VOXEL_SIZE: ${FM_VOXEL_SIZE:-0.04}
      FM_NOISE_FACTOR: ${FM_NOISE_FACTOR:-0.02}
      # Le noeud republie la grille ENTIERE a chaque mise a jour ; a 0,04 m un
      # carre de 20 m fait 250 k cellules. Le consommateur est une superposition
      # rafraichie a la main, 1 Hz suffit largement.
      FM_PUBLISH_PERIOD: ${FM_PUBLISH_PERIOD:-1.0}
    volumes:
      - ./config:/config:ro

  # ITS Path Planner, quatrieme brique. Pas un noeud : un GREFFON pluginlib
  # nav2_core::GlobalPlanner, donc c'est planner_server qui l'heberge et un
  # lifecycle_manager qui l'active. Etape E1 : planification sur la carte
  # FastMapping, sans robot dans la boucle.
  itsplanner:
    profiles: ["suite"]
    build:
      context: .
      dockerfile: services/itsplanner/Dockerfile
      additional_contexts:
        "edge-ai-robotics-ros-base:jazzy": "service:ros-base"
    # Depend de fastmapping : la couche statique du costmap est abonnee a
    # /world/map, que seule cette brique publie. Sans elle le costmap reste
    # entierement inconnu et le planificateur refuse toute requete.
    depends_on: [bus, source, groundfloor, fastmapping]
    environment:
      BUS_PUB: tcp://bus:5555
      BUS_SUB: tcp://bus:5556
      PYTHONUNBUFFERED: "1"
      ROS_DISTRO: jazzy
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-42}
      ITS_MAP_FRAME: ${ITS_MAP_FRAME:-map}
      ITS_BASE_FRAME: ${ITS_BASE_FRAME:-base_link}
      # La requete d'acceptation de E1 : d'un bord a l'autre de l'arene en
      # passant du cote de la barriere, pour qu'une ligne droite ne soit pas
      # une reponse valable.
      ITS_START_X: ${ITS_START_X:-1.8}
      ITS_START_Y: ${ITS_START_Y:-0.0}
      # x = 4.6 et non 5.8. Le but demande (5,8 ; -1,8) est DANS le bloc
      # cuisine : mesure sur la carte accumulee, 169 cellules sur 169 occupees
      # dans un rayon de 0,22 m, valeur centrale 100. Le planificateur le
      # refusait a juste titre -- "The start/goal pose is an obstacle",
      # its_planner.cpp:191 -- et aucun reglage ne rend atteignable un point
      # situe a l'interieur d'un obstacle.
      #
      # 4,6 garde le y demande exactement, donc l'intention est intacte : le
      # but reste profondement du cote barriere et une ligne droite depuis
      # (1,8 ; 0) traverserait le mobilier. C'est le point libre le plus proche
      # du but demande qui offre au moins 0,30 m de degagement : 1,20 m de
      # decalage, degagement mesure 0,341 m.
      # But choisi DANS LA CARTE, pas dans la piece. Recherche sur la grille
      # accumulee : parmi les cellules libres offrant au moins 0,30 m de
      # degagement, celles dont la ligne droite depuis le depart traverse de
      # l'occupation, classees par la plus longue portion pleine traversee.
      # Gagnant (2,1 ; -1,9), derriere le pilier proche droit -- l'obstacle que
      # seul ADBSCAN voit. La ligne droite y traverse 0,12 m plein ; le chemin
      # planifie ne traverse RIEN et fait 31 % de plus que la ligne droite.
      #
      # Le but precedent (4,6 ; -1,8) reste valable et atteignable, mais avec
      # lui la route n'a plus a contourner quoi que ce soit : il demontrait le
      # degagement, pas le contournement.
      ITS_GOAL_X: ${ITS_GOAL_X:-2.1}
      ITS_GOAL_Y: ${ITS_GOAL_Y:--1.9}
      ITS_REQUEST_PERIOD: ${ITS_REQUEST_PERIOD:-5.0}
      # E2. Repere du CORPS du robot, distinct de base_link qui reste le monde.
      # Renommer base_link aurait deplace en silence toutes les empreintes,
      # bornes d'arene et valeurs de calibration ecrites depuis l'etape B.
      ITS_ROBOT_FRAME: ${ITS_ROBOT_FRAME:-robot_base}
      ITS_ODOM_FRAME: ${ITS_ODOM_FRAME:-odom}
      # Trois buts distincts, enchaines a mesure qu'ils sont atteints.
      ITS_GOALS: ${ITS_GOALS:-2.1,-1.9;4.6,-1.8;2.6,0.9}
      GOAL_TOL: ${GOAL_TOL:-0.45}
      ITS_MIN_SAMPLES: ${ITS_MIN_SAMPLES:-250}
    volumes:
      - ./config:/config:ro
      # Monte pour scripts/its_sweep.py, qui doit s'executer DANS ce conteneur :
      # c'est un client d'action de planner_server, et le but est de mesurer le
      # planificateur tel qu'il est configure, pas de le reimplementer.
      - ./scripts:/scripts:ro

  # Console web. Profil de base : la demo doit etre regardable depuis un
  # navigateur du reseau local, le NUC etant loin de la television. Ne rend
  # rien lui-meme, il retransmet les trames deja encodees par le compositeur --
  # un second chemin de rendu serait libre de diverger du premier.
  #
  # AUCUNE AUTHENTIFICATION, RESEAU LOCAL UNIQUEMENT. Ecoute sur 0.0.0.0:8080 ;
  # quiconque atteint le port voit la camera et bascule les superpositions.
  web:
    build:
      context: .
      dockerfile: services/web/Dockerfile
    depends_on: [bus]
    environment:
      <<: *bus-env
      # Le conteneur ecoute TOUJOURS sur 8080 ; WEB_PORT ne choisit que le port
      # PUBLIE cote hote. Auparavant WEB_PORT etait aussi passe au service, si
      # bien qu'une valeur non par defaut faisait ecouter l'application sur ce
      # port-la pendant que la redirection visait toujours 8080 dans le
      # conteneur : plus rien ne repondait, sans message d'erreur.
      # Affiches tels quels dans le panneau d'etat. Ce sont les memes variables
      # que lisent sim et compositor, donc le panneau ne peut pas annoncer un
      # mode different de celui qui tourne.
      OBSTACLE_SOURCE: ${OBSTACLE_SOURCE:-ours}
      NAV_MODE: ${NAV_MODE:-patrol}
    ports:
      - "${WEB_PORT:-8080}:8080"
    restart: unless-stopped

  # Charge et puissance des trois moteurs, pour le panneau Platform de la
  # console. Un service a part et pas un fil dans `web` : il lance des binaires
  # privilegies (PCM lit les MSR) et il faut lui donner des capabilities que la
  # console, exposee sur le LAN et sans authentification, ne doit surtout pas
  # avoir. La separation est le point.
  telemetry:
    build:
      context: .
      dockerfile: services/telemetry/Dockerfile
    depends_on: [bus]
    environment:
      <<: *bus-env
      TELEMETRY_PERIOD: ${TELEMETRY_PERIOD:-1.0}
      # PCM et qmassa coutent ~1,3 s et ~2 s par mesure : ils tournent sur
      # leurs propres fils, derriere le verrou PMU, a cette periode-la. La
      # publication reste a TELEMETRY_PERIOD avec la derniere valeur connue.
      PMU_PERIOD: ${PMU_PERIOD:-2.0}
    volumes:
      # PCM : les MSR, un noeud par coeur. En rw, il ecrit dans certains MSR.
      - /dev/cpu:/dev/cpu:rw
      # qmassa : decouverte du BDF PCI du GPU Intel (pilote xe, tile*/gt*).
      - /sys/class/drm:/sys/class/drm:ro
      # NPU : temps occupe, frequence, memoire. Pas de compteur d'energie.
      - /sys/class/accel:/sys/class/accel:ro
      # Temperature paquet CPU : coretemp/temp1_input est "Package id 0".
      - /sys/class/hwmon:/sys/class/hwmon:ro
    devices:
      - /dev/dri:/dev/dri
    # Ouvrir /dev/cpu/N/msr echoue en EPERM sans ceci, meme en root et meme le
    # noeud monte : c'est le cgroup device qui refuse le caractere majeur 202.
    # Regle ciblee plutot que privileged.
    device_cgroup_rules:
      - 'c 202:* rmw'
    # Le binaire pcm porte ses file capabilities (setcap +ep dans le
    # Dockerfile), mais une file capability ne peut accorder que ce que
    # l'ensemble BOUNDING du conteneur contient deja. Sans ces trois, execve
    # echoue en rc=126 "Operation not permitted" sans nommer la cause.
    # Mesure : qmassa n'a besoin d'aucune des trois.
    cap_add:
      - SYS_RAWIO
      - SYS_ADMIN
      - DAC_OVERRIDE
    # Les deux, et pour deux raisons differentes :
    #
    #   apparmor=unconfined     acces MSR. Sans lui pcm sort en rc=1.
    #   systempaths=unconfined  rend /proc/sys accessible en ECRITURE. PCM
    #                           refuse de demarrer tant que le chien de garde
    #                           NMI est actif et qu'il n'utilise pas perf :
    #                           "Unsupported mode. NMI watchdog is enabled and
    #                           Linux perf_event driver is not used". Il le
    #                           desactive lui-meme le temps de la mesure puis le
    #                           remet, ce qui demande /proc/sys en ecriture.
    #
    # Un test anterieur avait conclu que systempaths etait inutile : il etait
    # fausse par l'etat de l'hote, une execution precedente ayant laisse
    # kernel.nmi_watchdog a 0. PCM_USE_PERF=1 ne remplace pas ceci, verifie.
    #
    # Alternative moins permissive, NON verifiee ici faute de droits root sur
    # l'hote : poser kernel.nmi_watchdog=0 une fois sur l'hote. PCM le trouverait
    # deja a 0 et n'aurait plus rien a ecrire. A preferer si quelqu'un peut le
    # tester, car en l'etat PCM bascule ce reglage de l'hote a chaque mesure.
    security_opt:
      - apparmor=unconfined
      - systempaths=unconfined
    restart: unless-stopped

  recorder:
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      RECORDER_DB: /data/edgebot.sqlite
      RECORD_HZ: "3"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped
