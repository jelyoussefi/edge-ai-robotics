name: edge-ai-robotics

x-bus-env: &bus-env
  BUS_PUB: tcp://bus:5555
  BUS_SUB: tcp://bus:5556
  PYTHONUNBUFFERED: "1"

services:

  # Message broker. Every other service connects here, so adding perception
  bus:
    build:
      context: .
      dockerfile: services/bus/Dockerfile
    environment: *bus-env
    expose:
      - "5555"
      - "5556"
    restart: unless-stopped

  # Physics. CPU only — MuJoCo's solver does not use the GPU, which is what
  # leaves the iGPU free for rendering and, later, perception.
  sim:
    build:
      context: .
      dockerfile: services/sim/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      POLICY: rl
      PHYSICS_HZ: "1000"
      CONTROL_HZ: "50"
      PUBLISH_HZ: "60"
      POLICY_PATH: /policies/g1_walker/walker.onnx
      OV_DEVICE: ${OV_DEVICE:-GPU}
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./models:/models:ro
      - ./policies:/policies:ro
    restart: unless-stopped

  # Rendering to the TV. Needs the host X socket and the Intel iGPU.
  # Source. The single camera owner: reads RGB + depth and broadcasts each on
  # its own bus channel with a shared timestamp. Needs the privileged USB access
  # librealsense requires.
  source:
    build:
      context: .
      dockerfile: services/source/Dockerfile
    depends_on:
      - bus
    privileged: true
    environment:
      <<: *bus-env
      SOURCE_CONFIG: /config/streams.d455.json
      DISPLAY: ${DISPLAY:-:0}
      # The RealSense spatial/temporal/hole-filling filters. Set to 0 to see the
      # raw depth, which is full of holes on glossy floors.
      DEPTH_FILTERS: "1"
    volumes:
      - ./config:/config
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - /dev:/dev
      - /dev/bus/usb:/dev/bus/usb
    restart: unless-stopped

  compositor:
    build:
      context: .
      dockerfile: services/compositor/Dockerfile
    depends_on:
      - bus
      - source
    # No camera: the compositor receives RGB + depth from the source over the
    # bus. It only needs the GPU for rendering and the display.
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      DISPLAY: ${DISPLAY:-:0}
      # GLFW creates the visible GL context (validated: GL 4.6 + FBO on the host).
      # MuJoCo renders into that current context. MUJOCO_GL=glx matches the GLX
      # context GLFW provides on X11; EGL was a wrong turn (gladLoadGL error).
      MUJOCO_GL: glx
      LIBVA_DRIVER_NAME: iHD
      INTEL_FORCE_PROBE: "0xb080"
      XDG_RUNTIME_DIR: /tmp/runtime-compositor
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ./models:/models:ro
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped

  # Perception. Receives camera frames from the compositor over the bus and runs
  # detection; it no longer opens the camera itself.
  perception:
    build:
      context: .
      dockerfile: services/perception/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      PERCEPTION_CONFIG: /config/streams.d455.json
    devices:
      - /dev/dri:/dev/dri
      - /dev/accel:/dev/accel
    group_add:
      - "${RENDER_GID:-993}"
      - "${VIDEO_GID:-44}"
    volumes:
      - ./config:/config:ro
      - ./assets:/assets:ro
    restart: unless-stopped

  # Recorder. Persists calibration and runtime telemetry to a SQLite file on a
  # mounted volume. Passive: subscribes only to small messages, never the camera.
  recorder:
    build:
      context: .
      dockerfile: services/recorder/Dockerfile
    depends_on:
      - bus
    environment:
      <<: *bus-env
      ROBOT: g1_walker
      RECORDER_DB: /data/edgebot.sqlite
      RECORD_HZ: "3"
    volumes:
      - ./config:/config:ro
      - ./data:/data
    restart: unless-stopped
